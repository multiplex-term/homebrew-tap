name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump-script:
    name: bump script tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s script -t script -v

  formula:
    name: brew style · audit
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      # Registers this checkout as the multiplex-term/tap tap — that is why
      # the repository is named homebrew-tap: the action (and `brew install
      # multiplex-term/tap/mpx` itself) resolve the tap to a repo with the
      # homebrew- prefix, and only a registered tap can be audited, since
      # `brew audit <path>` is disabled in current Homebrew.
      - uses: Homebrew/actions/setup-homebrew@master
      - name: style
        run: brew style multiplex-term/tap/mpx
      - name: audit
        # --online verifies every download URL actually resolves, which is what
        # catches a bump pointing at a release that was never published. It used
        # to run behind a check that a public release existed at all, because
        # mpx's downloads lived in a separate repo while the source was closed;
        # they come from the public `mpx-cli` now, so the URLs always resolve
        # for an anonymous runner and the audit is unconditional.
        run: brew audit --formula --online multiplex-term/tap/mpx

  # A partial bump is the failure worth catching: some digests real, some still
  # the placeholder means one platform installs nothing. All-placeholder is the
  # legitimate state before the first release has ever run through here.
  digests:
    name: digests are all real or all placeholder
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          total=$(grep -c 'sha256 "' Formula/mpx.rb)
          blank=$(grep -c 'sha256 "0\{64\}"' Formula/mpx.rb || true)
          echo "$blank of $total digests are placeholders"
          if [ "$blank" -eq 0 ]; then
            echo "fully bumped"
          elif [ "$blank" -eq "$total" ]; then
            echo "::notice::no release published through this formula yet"
          else
            echo "::error::partial bump — $blank of $total platforms would install nothing"
            exit 1
          fi
